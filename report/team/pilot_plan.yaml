# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm (statsmodels ra 1.250; tổng 2.502).
#   b) Theo nhân viên, m = 75: DE = 2,48; n = 3.103 yêu cầu/nhóm -> cần 42 NV/nhóm (tổng 84 > 40 NV hiện có: KHÔNG ĐỦ NGƯỜI).
#   c) 20 nhân viên mỗi nhóm: trần cỡ mẫu hiệu dụng c / ICC = 20 / 0,02 = 1.000 < 1.251 (KHÔNG ĐẠT mục tiêu +5 điểm).
#   d) 6 depot mỗi nhóm: trần cỡ mẫu hiệu dụng c / ICC = 6 / 0,02 = 300 (quá thấp và < 20 cụm/nhóm: LOẠI).
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: cần m >= 299 yêu cầu mỗi nhân viên (DE = 6,96).
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên nhóm đối chứng làm song song cùng tuần, cùng depot với 20 nhân viên nhóm trợ lý.
#   2. Chia ngẫu nhiên hay do người chọn: Chia ngẫu nhiên bằng code với seed chốt trước, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro chia sẻ câu trả lời trong depot; giảm bằng phân quyền theo tài khoản và log mọi lượt mở theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, chốt trước ngày chạy (MDE +6 điểm, n=859, power 0,80, ngày quyết định 2027-01-05).
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 nhân viên (cụm) mỗi nhóm.
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện): Chấp nhận nới MDE từ +5 lên +6 điểm (859 mẫu hiệu dụng/nhóm) khi chia theo 20 nhân viên/nhóm; nếu tác động thật chỉ là +5 điểm thì power giảm còn 0,64.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn: Hiện tại toàn bộ mẫu là 4,25% (51/1.200) và phạm vi noi_dia + hang_nang là 3,97% (39/982). Không đặt ngưỡng tuyệt đối 3% (sẽ dừng ngay tuần đầu) mà đặt ngưỡng so với đối chứng (+2 điểm) kèm trần tuyệt đối 6% và 0 ca hoàn trùng.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia (0,22×, simulated) và hang_nang (0,69×, simulated) tại các depot; loại quoc_te (1,88×, simulated) và doi_tac (0,85×, simulated)"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần (4 -> 10 -> 20 nhân viên); chỉ đo chỉ số chính từ bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi từ 0.05 lên 0.06 để đủ cỡ mẫu hiệu dụng với 20 cụm/nhóm (power 0.64 nếu MDE thật 0.05)
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "20 nhân viên đối chứng chạy song song cùng tuần, cùng depot với 20 nhân viên dùng trợ lý"
    spillover_risk: "Nhân viên trong cùng depot có thể hỏi nhau; giảm bằng phân quyền tài khoản cá nhân và ghi log staff_id mọi lượt dùng trợ lý"
    predeclared: "Chốt trước ngày chạy pilot: chỉ số chính, MDE 0,06 (n=859, m>=299, DE=6,96), 3 luật dừng và ngày quyết định 2027-01-05"
  stop_rules:
    - "NẾU tỉ lệ mo_lai_trong_7_ngay của nhóm trợ lý cao hơn đối chứng >= 2 điểm phần trăm hoặc vượt trần 6%, hoặc phát sinh >= 1 ca hoàn tiền trùng lặp TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành LogiX-VN bật cờ rollback tắt trợ lý trong 30 phút KHÔNG THÌ không được tiếp tục bước rollout tiếp theo"
    - "NẾU chi phí mỗi việc thành công vượt 8.000 đ [simulated] TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp phạm vi về chỉ noi_dia và giới hạn tối đa 2 lần chạy KHÔNG THÌ không được mở rộng sang hang_nang"
    - "NẾU tỉ lệ bỏ qua gợi ý (sua + bo) vượt 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn ít nhất 5 nhân viên trong 3 ngày để sửa quy trình/gợi ý KHÔNG THÌ không được tăng tỉ lệ rollout"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành LogiX-VN bấm cờ tắt trên bảng điều khiển, hiệu lực trong 30 phút; khách hàng được phục vụ bằng quy trình nhân viên tự làm hoàn toàn"
  decision_date: "2027-01-05"
  simulated_inputs:
    - "Chi phí mỗi việc thành công chung 4.472 đ (simulated)"
    - "Chi phí phạm vi noi_dia 2.696 đ [0,22x] và hang_nang 8.221 đ [0,69x] (simulated)"
    - "Chi phí xem lại 100% phạm vi pilot 11.743-12.415 đ (simulated)"
    - "Kịch bản làm lại gấp đôi +51,8% lên 6.787 đ (simulated)"
